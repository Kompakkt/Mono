services:
  # Caddy is used as a reverse proxy
  caddy:
    image: "caddy:2-alpine"
    volumes:
      - "./Caddyfile:/etc/caddy/Caddyfile"
      - "./Repo:/srv/repo:ro"
      - "./Viewer:/srv/viewer:ro"
    ports:
      - "127.0.0.1:8080:80"
    environment:
      - CADDY_REPORTING_DOMAIN=${CADDY_REPORTING_DOMAIN:-"https://kompakkt.de"}

  # Supporting services
  mongo:
    image: "docker.io/mongo:8-noble"
    environment:
      - MONGO_INITDB_ROOT_USERNAME=admin
      - MONGO_INITDB_ROOT_PASSWORD=password
    ports:
      - "127.0.0.1:37017:27017"
    volumes:
      - "mongodb_data:/data/db"
  redis:
    image: "docker.io/redis:8-alpine"
    ulimits:
      memlock: -1
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - "redis_data:/data"
  mailhog:
    image: "mailhog/mailhog:latest"
    ports:
      - "127.0.0.1:8025:8025"
  kompressor:
    image: "ghcr.io/kompakkt/kompressor:latest"
    user: "${UID}:${GID}"
    volumes:
      - "uploads:/app/uploads"
  preview-gen:
    image: "ghcr.io/kompakkt/previewgen:main"
    environment:
      - PREVIEW_GEN_PORT=14841

  # Kompakkt services
  server:
    env_file: .env
    image: docker.io/oven/bun:1.4-alpine
    user: "${UID}:${GID}"
    volumes:
      - "./Server:/kompakkt/Server"
      - "uploads:/kompakkt/Server/src/uploads"
      - "./server-config.json:/kompakkt/Server/src/config.json:ro"
      - "/proc:/host/proc:ro"
      - "/sys:/host/sys:ro"
    depends_on:
      - mongo
      - redis
      - kompressor
      - preview-gen
      - mailhog
    ports:
      - "127.0.0.1:8123:3030"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    working_dir: /kompakkt/Server
    command: |
      sh -c "bun install; bun run dev"
    environment:
      - PREVIEW_GEN_PORT=14841
  repo:
    image: docker.io/oven/bun:1.4-alpine
    depends_on:
      - server
    user: "${UID}:${GID}"
    volumes:
      - "./Repo:/kompakkt/Repo"
      - "./shared-environment.ts:/kompakkt/Repo/src/environment.ts:ro"
      - "./repo.custom-plugins.ts:/kompakkt/Repo/src/app/custom-plugins.ts:ro"
    working_dir: /kompakkt/Repo
    environment:
      - SHELL=/bin/sh
    command: |
      sh -c "bun install; bunx chokidar-cli --debounce 5000 'src/**/*' 'angular.json' 'tsconfig*.json' -c 'bun run --bun ng build' --initial"
  viewer:
    image: docker.io/oven/bun:1.4-alpine
    depends_on:
      - server
    user: "${UID}:${GID}"
    volumes:
      - "./Viewer:/kompakkt/Viewer"
      - "./shared-environment.ts:/kompakkt/Viewer/src/environment.ts:ro"
      - "./viewer.custom-plugins.ts:/kompakkt/Viewer/src/app/custom-plugins.ts:ro"
    working_dir: /kompakkt/Viewer
    environment:
      - SHELL=/bin/sh
    command: |
      sh -c "bun install; bunx chokidar-cli --debounce 5000 'src/**/*' 'angular.json' 'tsconfig*.json' -c 'bun run --bun ng build' --initial"
  kompakkt-reverse-proxy:
    image: docker.io/oven/bun:1.4-alpine
    user: "${UID}:${GID}"
    volumes:
      - "./Repo:/kompakkt/repo:ro"
      - "./Viewer:/kompakkt/viewer:ro"
      - "./KRP:/kompakkt/KRP"
    working_dir: /kompakkt/KRP
    command: |
      sh -c "bun install; bun run dev"
    ports:
      - "127.0.0.1:8081:3030"

volumes:
  uploads:
    driver: local
    driver_opts:
      type: none
      device: ./uploads
      o: bind
  mongodb_data: null
  redis_data: null
